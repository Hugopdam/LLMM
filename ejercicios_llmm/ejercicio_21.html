<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 21</title>
    <style>
        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .gallery a {
            text-decoration: none;
        }
        .gallery img {
            width: 150px;
            height: auto;
            border: 2px solid #ddd;
            border-radius: 4px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .gallery img:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <h1>Thumbnail Gallery</h1>
    <div class="gallery">
        <a href="https://www.w3schools.com/html/img_girl.jpg" target="_blank">
            <img src="https://www.w3schools.com/html/img_girl.jpg" alt="Girl with a hat">
        </a>
        <a href="https://www.w3schools.com/html/img_chania.jpg" target="_blank">
            <img src="https://www.w3schools.com/html/img_chania.jpg" alt="Chania">
        </a>
        <a href="https://www.w3schools.com/html/pic_trulli.jpg" target="_blank">
            <img src="https://www.w3schools.com/html/pic_trulli.jpg" alt="Forest">
        </a>
    </div>
</body>
</html>
