<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página con Navbar y Galería</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            box-sizing: border-box;
        }

        .navbar {
            overflow: hidden;
            background-color: #333;
            display: flex;
            justify-content: space-around;
        }

        .navbar a {
            color: white;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
            display: block;
        }

        .navbar a:hover {
            background-color: #575757;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            padding: 20px;
        }

        .gallery img {
            width: 100%;
            height: auto;
            border-radius: 8px;
        }


        @media (max-width: 600px) {
            .navbar {
                flex-direction: column;
            }

            .navbar a {
                text-align: left;
            }
        }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="#">Inicio</a>
        <a href="#">Galería</a>
        <a href="#">Contacto</a>
    </div>


    <div class="gallery">
        <img src="https://www.w3schools.com/css/img_5terre.jpg" alt="Imagen 1">
        <img src="https://www.w3schools.com/css/img_forest.jpg" alt="Imagen 2">
        <img src="https://www.w3schools.com/css/img_lights.jpg" alt="Imagen 3">
        <img src="https://www.w3schools.com/css/img_mountains.jpg" alt="Imagen 4">
        <img src="https://www.w3schools.com/css/img_snow.jpg" alt="Imagen 5">
        <img src="https://www.w3schools.com/css/img_forest.jpg" alt="Imagen 6">
    </div>
</body>
</html>
