<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabla de Colores RGB</title>
<style>
  body {
    font-family: Arial, sans-serif;
  }

  table {
    width: 50%;
    border-collapse: collapse;
    margin: 20px auto;
    box-shadow: 3px 3px 5px rgba(0, 0, 0, 0.3);
  }

  th, td {
    border: none;
    padding: 10px;
    text-align: left;
  }

  th {
    background-color: #555;
    color: white;
    font-weight: bold;
  }

  tr:nth-child(odd) {
    background-color: #f9f9f9;
  }

  .footer {
    background-color: #555;
    color: white;
    padding: 10px;
    font-family: monospace;
  }

</style>
</head>
<body>

<table>
  <tr>
    <th>Name</th>
    <th>Red</th>
    <th>Green</th>
    <th>Blue</th>
  </tr>
  <tr>
    <td>Light Sand</td>
    <td>254</td>
    <td>255</td>
    <td>239</td>
  </tr>
  <tr>
    <td>Beige</td>
    <td>245</td>
    <td>245</td>
    <td>220</td>
  </tr>
  <tr>
    <td>Chocolate</td>
    <td>210</td>
    <td>105</td>
    <td>30</td>
  </tr>
  <tr>
    <td>Gray</td>
    <td>190</td>
    <td>190</td>
    <td>190</td>
  </tr>
  <tr>
    <td colspan="4" class="footer">
      Use like this: color: rgb(RED, GREEN, BLUE);
    </td>
  </tr>
</table>

</body>
</html>
